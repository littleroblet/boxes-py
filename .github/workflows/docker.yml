name: Build and Publish Docker Image

on:
  push:
    branches: [ "latest" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/boxes-py:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/boxes-py:latest
